<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f0df"><meta name="description" content="REVERSE — kısa molalar için özgün bir matematik bulmacası. Godot ile yapıldı."><title>REVERSE · Sayılarla oyna</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f6f0df;color:#243449;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}body{touch-action:none}#canvas{display:block;width:100%;height:100%;outline:none}#boot{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:28px;background:radial-gradient(circle at 0 0,#e4ead9,transparent 60%),radial-gradient(circle at 100% 100%,#edddbd,transparent 60%),#f6f0df;z-index:10}.mark{display:flex;justify-content:center;gap:10px;margin-bottom:30px}.mark span{display:grid;place-content:center;width:64px;height:68px;border-radius:19px;background:#e67d65;box-shadow:0 6px #24344918;font-size:30px;font-weight:800;transform:rotate(-7deg)}.mark span:nth-child(2){background:#e9ba61;transform:translateY(-12px) rotate(5deg)}.mark span:nth-child(3){background:#83a98b;transform:rotate(9deg)}h1{font-size:clamp(42px,9vw,68px);letter-spacing:-3px;margin:0 0 10px;font-weight:900}p{font-size:16px;line-height:1.5;max-width:340px;color:#64726a;margin:8px auto}progress{appearance:none;width:min(280px,75vw);height:10px;margin:26px auto 15px;border:0;border-radius:8px;overflow:hidden;background:#24344912}progress::-webkit-progress-bar{background:#24344912}progress::-webkit-progress-value{background:#e67d65;border-radius:8px}progress::-moz-progress-bar{background:#e67d65;border-radius:8px}#notice{white-space:pre-line;max-width:380px;font-size:14px}button{border:0;border-radius:14px;background:#e67d65;color:#243449;font:inherit;font-weight:700;padding:14px 24px;margin:12px;cursor:pointer}#retry{display:none}.small{font-size:12px;margin-top:24px;opacity:.75}.error progress{display:none}noscript{position:fixed;inset:0;background:#f6f0df;display:grid;place-content:center;text-align:center;z-index:20;padding:30px}</style>
$GODOT_HEAD_INCLUDE</head><body><canvas id="canvas" tabindex="0" aria-label="REVERSE matematik bulmaca oyunu">Bu oyun WebGL 2 destekleyen bir tarayıcı gerektirir.</canvas><div id="boot" role="status" aria-live="polite"><div class="mark" aria-hidden="true"><span>2</span><span>↔</span><span>4</span></div><h1>REVERSE</h1><p>İki yön. İki hedef. Tek çözüm.</p><progress id="progress" max="100"></progress><p id="notice">Oyun hazırlanıyor…</p><button id="retry" onclick="location.reload()">Yeniden dene</button><p class="small">Godot ile yapıldı · Oynamak ücretsiz</p></div><noscript>Oyunu açmak için tarayıcında JavaScript'i etkinleştir.</noscript>
<script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG;const engine=new Engine(config);const boot=document.getElementById('boot');const progress=document.getElementById('progress');const notice=document.getElementById('notice');
function failure(error){console.error(error);boot.classList.add('error');notice.textContent='Oyun başlatılamadı. Güncel Safari, Chrome, Edge veya Firefox kullan ve WebGL 2 desteğinin açık olduğundan emin ol.\n'+(error.message||String(error));document.getElementById('retry').style.display='inline-block'}
const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
if(missing.length){failure(new Error(missing.join(', ')))}else{engine.startGame({onProgress:(current,total)=>{if(total>0){progress.value=current*100/total;notice.textContent='Yükleniyor · %'+Math.round(current*100/total)}else{progress.removeAttribute('value')}}}).then(()=>{boot.remove();document.getElementById('canvas').focus()}).catch(failure)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.getElementById('canvas').focus()});
</script></body></html>
